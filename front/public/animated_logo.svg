<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <style>
        .cls-1 { fill: none; stroke: #8a5cc9; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2px; }
        .wave-left { fill: none; stroke: #8a5cc9; stroke-linecap: round; stroke-width: 1.5px; }
        .wave-right { fill: none; stroke: #8a5cc9; stroke-linecap: round; stroke-width: 1.5px; }
    </style>

    <!-- Меняйте translate(X, Y) для точной настройки -->
    <!-- X: смещение по горизонтали, Y: смещение по вертикали -->
    <g transform="translate(28, 22) scale(1.3)">
        
        <path class="cls-1" d="M26.61,8.5c0,1.24-.32,2.39-.88,3.4-1.19,2.15-3.48,3.6-6.12,3.6s-4.85-1.4-6.06-3.5c-.6-1.03-.94-2.22-.94-3.5s.32-2.39.88-3.4c1.19-2.15,3.48-3.6,6.12-3.6s4.85,1.4,6.06,3.5c.6,1.03.94,2.22.94,3.5Z"/>
        
        <path class="cls-1" d="M22.81,20c-7.93,0-19.2,5.43-21.7,29,1.75,0,18.65,0,23,0,0,0-2.51-15.88-1.3-29Z"/>
        
        <path class="wave-left" d="M8.36,15c-1.11-1.91-1.75-4.13-1.75-6.5s.59-4.44,1.63-6.31">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="1s" repeatCount="indefinite" />
            <animate attributeName="stroke-dasharray" values="0 50;50 0;0 50" dur="2s" repeatCount="indefinite" />
        </path>
        
        <path class="wave-right" d="M30.86,2c1.11,1.91,1.75,4.13,1.75,6.5s-.59,4.44-1.63,6.31">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="1s" begin="0.15s" repeatCount="indefinite" />
            <animate attributeName="stroke-dasharray" values="0 50;50 0;0 50" dur="2s" begin="0.3s" repeatCount="indefinite" />
        </path>
        
        <path class="wave-left" d="M5.75,16.5c-1.36-2.35-2.14-5.08-2.14-8s.73-5.46,2.01-7.76">
            <animate attributeName="opacity" values="0.1;1;0.1" dur="1.5s" begin="0.3s" repeatCount="indefinite" />
            <animate attributeName="stroke-dasharray" values="0 60;60 0;0 60" dur="2.5s" repeatCount="indefinite" />
        </path>
        
        <path class="wave-right" d="M33.47.5c1.36,2.35,2.14,5.08,2.14,8s-.73,5.46-2.01,7.76">
